services:
  - type: web
    name: cpmm-shield
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALGORAND_NETWORK
        value: testnet
      - key: FACILITATOR_URL
        value: https://facilitator.goplausible.xyz
      - key: DEMO_MODE
        value: "false"
      - key: API_BASE_URL
        sync: false
      - key: PAY_TO_ADDRESS
        sync: false
      - key: TREASURY_MNEMONIC
        sync: false
